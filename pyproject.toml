[project]
name = "tcc-ipa"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "jonnguii", email = "jg.cravo@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tcc-ipa = "tcc_ipa:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
