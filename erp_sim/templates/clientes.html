{% extends "base.html" %}
{% block content %}
<h2>Clientes</h2>
<a href="/clientes/novo" class="btn">Novo Cliente</a><br><br>
<table data-testid="tabela-clientes">
  <tr><th>ID</th><th>Nome</th><th>CNPJ/CPF</th><th>Email</th></tr>
  {% for c in clientes %}
  <tr><td>{{ c.id }}</td><td>{{ c.nome }}</td><td>{{ c.cnpj_cpf }}</td><td>{{ c.email }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
