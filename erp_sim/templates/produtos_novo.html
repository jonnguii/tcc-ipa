{% extends "base.html" %}
{% block content %}
<div class="form-container">
  <div class="form-intro">
    <h2>Novo produto</h2>
  </div>

  {% if error %}
  <div class="msg-erro">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/produtos/novo" id="produtoForm" novalidate>
    <div class="form-group">
      <label for="codigo" class="required">Código</label>
      <input
        type="text"
        id="codigo"
        name="codigo"
        required
        placeholder="P-001"
        pattern="[A-Za-z0-9\-]+"
      >
      <span class="help-text">Código único do produto (ex: P-001)</span>
      <span class="error-message" id="codigo-error">Código é obrigatório</span>
    </div>

    <div class="form-group">
      <label for="descricao" class="required">Descrição</label>
      <input
        type="text"
        id="descricao"
        name="descricao"
        required
        minlength="3"
        placeholder="Descrição do produto"
      >
      <span class="error-message" id="descricao-error">Descrição deve ter pelo menos 3 caracteres</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="unidade" class="required">Unidade</label>
        <select id="unidade" name="unidade" required>
          <option value="">Selecione...</option>
          <option value="UN">UN - Unidade</option>
          <option value="CX">CX - Caixa</option>
          <option value="PCT">PCT - Pacote</option>
          <option value="KG">KG - Quilograma</option>
          <option value="L">L - Litro</option>
          <option value="M">M - Metro</option>
          <option value="M2">M² - Metro Quadrado</option>
        </select>
        <span class="error-message" id="unidade-error">Selecione uma unidade</span>
      </div>

      <div class="form-group">
        <label for="preco" class="required">Preço (R$)</label>
        <input
          type="number"
          id="preco"
          name="preco"
          required
          min="0"
          step="0.01"
          placeholder="0.00"
        >
        <span class="error-message" id="preco-error">Preço deve ser maior ou igual a 0</span>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">
      <span>Salvar Produto</span>
    </button>

    <a href="/produtos" class="btn btn-secondary">Cancelar</a>
  </form>
</div>

<script>
  const form = document.getElementById('produtoForm');
  const submitBtn = document.getElementById('submitBtn');

  // Validação em tempo real
  document.getElementById('codigo').addEventListener('input', function() {
    const errorSpan = document.getElementById('codigo-error');
    if (!this.value) {
      this.classList.add('error');
      errorSpan.classList.add('visible');
    } else {
      this.classList.remove('error');
      this.classList.add('success');
      errorSpan.classList.remove('visible');
    }
  });

  document.getElementById('descricao').addEventListener('input', function() {
    const errorSpan = document.getElementById('descricao-error');
    if (this.value && this.value.length < 3) {
      this.classList.add('error');
      errorSpan.classList.add('visible');
    } else {
      this.classList.remove('error');
      this.classList.add('success');
      errorSpan.classList.remove('visible');
    }
  });

  document.getElementById('unidade').addEventListener('change', function() {
    const errorSpan = document.getElementById('unidade-error');
    if (!this.value) {
      this.classList.add('error');
      errorSpan.classList.add('visible');
    } else {
      this.classList.remove('error');
      this.classList.add('success');
      errorSpan.classList.remove('visible');
    }
  });

  document.getElementById('preco').addEventListener('input', function() {
    const errorSpan = document.getElementById('preco-error');
    if (this.value === '' || parseFloat(this.value) < 0) {
      this.classList.add('error');
      errorSpan.classList.add('visible');
    } else {
      this.classList.remove('error');
      this.classList.add('success');
      errorSpan.classList.remove('visible');
    }
  });

  // Loading state ao submeter
  form.addEventListener('submit', function(e) {
    let valid = true;

    if (!document.getElementById('codigo').value) {
      document.getElementById('codigo').classList.add('error');
      document.getElementById('codigo-error').classList.add('visible');
      valid = false;
    }

    if (document.getElementById('descricao').value.length < 3) {
      document.getElementById('descricao').classList.add('error');
      document.getElementById('descricao-error').classList.add('visible');
      valid = false;
    }

    if (!document.getElementById('unidade').value) {
      document.getElementById('unidade').classList.add('error');
      document.getElementById('unidade-error').classList.add('visible');
      valid = false;
    }

    if (!document.getElementById('preco').value || parseFloat(document.getElementById('preco').value) < 0) {
      document.getElementById('preco').classList.add('error');
      document.getElementById('preco-error').classList.add('visible');
      valid = false;
    }

    if (!valid) {
      e.preventDefault();
      showToast('Por favor, corrija os erros antes de enviar', 'error');
      return;
    }

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span><span>Salvando...</span>';
  });
</script>
{% endblock %}
