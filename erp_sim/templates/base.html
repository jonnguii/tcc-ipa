<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ERP Simulado - Sistema de gestão para TCC IPA">
  <title>{% block title %}{% if request.url.path.startswith('/clientes') %}Clientes{% elif request.url.path.startswith('/produtos') %}Produtos{% elif request.url.path == '/pedidos/novo' %}Novo pedido{% elif request.url.path.startswith('/pedidos/') %}Detalhes do pedido{% else %}Pedidos{% endif %}{% endblock %} · Fluxo ERP</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand-wrap" href="/pedidos" aria-label="Fluxo ERP — início">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V20" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Fluxo<span>ERP</span></div>
          <div class="brand-subtitle">Gestão de pedidos</div>
        </div>
      </a>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="/pedidos" {% if request.url.path.startswith('/pedidos') %}aria-current="page"{% endif %}>Pedidos</a>
        <a href="/clientes" {% if request.url.path.startswith('/clientes') %}aria-current="page"{% endif %}>Clientes</a>
        <a href="/produtos" {% if request.url.path.startswith('/produtos') %}aria-current="page"{% endif %}>Produtos</a>
      </nav>

      <div class="topbar-tools">
        <span class="environment-badge"><span class="status-dot"></span> Ambiente de demonstração</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema" title="Alternar tema">
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <p><span>Fluxo ERP</span> <span aria-hidden="true">·</span> Sistema demonstrativo de gestão de pedidos</p>
  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function updateIcons(theme) {
      if (theme === 'dark') {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateIcons(theme);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      applyTheme(theme);
    }

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    });

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();

      const urlParams = new URLSearchParams(window.location.search);

      if (urlParams.get('msg')) {
        showToast(urlParams.get('msg'), 'success');
      }

      if (urlParams.get('msg_erro')) {
        showToast(urlParams.get('msg_erro'), 'error');
      }

      if (urlParams.get('msg_duplicado')) {
        showToast(urlParams.get('msg_duplicado'), 'warning');
      }
    });
  </script>
</body>
</html>
