<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% if request.url.path.startswith('/clientes') %}Clientes{% elif request.url.path.startswith('/produtos') %}Produtos{% elif request.url.path == '/pedidos/novo' %}Novo pedido{% elif request.url.path.startswith('/pedidos/') %}Detalhes do pedido{% else %}Pedidos{% endif %}{% endblock %} - ERP Simulado</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand-wrap" href="/pedidos">
        <span class="brand-name">ERP Simulado</span>
      </a>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="/pedidos" {% if request.url.path.startswith('/pedidos') %}aria-current="page"{% endif %}>Pedidos</a>
        <a href="/clientes" {% if request.url.path.startswith('/clientes') %}aria-current="page"{% endif %}>Clientes</a>
        <a href="/produtos" {% if request.url.path.startswith('/produtos') %}aria-current="page"{% endif %}>Produtos</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <p>ERP Simulado - Ambiente de Teste</p>
  </footer>
</body>
</html>
